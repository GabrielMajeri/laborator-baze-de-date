name: Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Check out the code
        uses: actions/checkout@v7
        with:
          # Fix for LFS files (https://zihaofu245.github.io/general/2025/09/12/git-lfs-guide.html)
          lfs: true
          fetch-depth: 0

      # Cache LFS objects
      - name: Cache Git LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: $-git-lfs-$-$
          restore-keys: |
            $-git-lfs-$-
            $-git-lfs-

      # Ensure LFS files are real (materialize)
      - name: Ensure LFS files are real (materialize)
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs fetch origin "${GITHUB_SHA}"
          git lfs checkout
          echo "LFS files tracked (pointer -> actual):"
          git lfs ls-files

      # Verify no LFS pointers in source assets
      - name: Verify no LFS pointers in source assets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIl "version https://git-lfs.github.com/spec" assets 2>/dev/null; then
            echo "::error::Found LFS pointer(s) under assets/. 'git lfs checkout' did not materialize some files." >&2
            exit 1
          fi
          echo "No LFS pointers in raw source assets."

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # Install a specific version of uv.
          version: "0.12.23"

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Build the website
        run: uv run zensical build --clean

      - name: Upload the built site to Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Update the GitHub Pages deployment
        uses: actions/deploy-pages@v5
        id: deployment
